{% extends "base.html" %}
{% block content %}
<div id = "basestyle">
    <h1>{{message}}</h1>
    <form action = "{{url_for('confirm_password')}}" method = "post">
        <label for = "OldPwd">Password:</label><br>
        <input type = "password" id = "old_pwd" name = "old_pwd" value = "" onmouseover = "changeBG('old_pwd')" onmouseout = "restoreBG('old_pwd')"><br>
        <label for = "NewPwd">New Password:</label><br>
        <input type = "password" id = "new_pwd" name = "new_pwd" value = "" onmouseover = "changeBG('new_pwd')" onmouseout = "restoreBG('new_pwd')"><br>
        <label for = "ConfirmNewPwd">Confirm Password:</label><br>
        <input type = "password" id = "confirm_pwd" name = "confirm_pwd" value = "" onmouseover = "changeBG('confirm_pwd')" onmouseout = "restoreBG('confirm_pwd')"><br>
        <input type = "submit" value = "Change Password">
    </form>
</div>
{% endblock %}
