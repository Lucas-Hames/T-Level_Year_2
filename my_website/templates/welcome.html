{% extends "base.html" %}
{% block content %}
<div id = "basestyle">
    <h1>Welcome Back</h1>
    <h2>{{web_uname}}</h2>
    <form action = "{{url_for('showall')}}" method = "post">
        <input type = "submit" value = "Show Info">
        <input type = "hidden" id = "uname" name = "uname" value = "{{web_uname}}">
    </form>
    <form action = "{{url_for('change_password')}}" method = "post">
        <input type = "submit" value = "Change Password">
    </form>
    <form action = "{{url_for('delete_user')}}" method = "post">
        <input type = "submit" value = "Delete">
    </form>
</div>
{% endblock %}
