{% extends "base.html" %}
{% block content %}
<script src = "/static/validate_registration.js"></script>
<script src = "/static/change_background.js"></script>
<div id = "basestyle">
    <h1>{{header}}</h1>
    <form action = "{{url_for('register_user')}}" method = "post" onsubmit = "return validate()">
        <label for = "Uname">Username:</label><br>
        <input type = "text" id = "uname" name = "uname" value = "" onmouseover = "changeBG('uname')" onmouseout = "restoreBG('uname')"><br>
        <label for = "Email">Email:</label><br>
        <input type = "email" id = "email" name = "email" value = "" onmouseover = "changeBG('email')" onmouseout = "restoreBG('email')"><br>
        <label for = "Pwd">Password:</label><br>
        <input type = "password" id = "pwd" name = "pwd" value = "" onmouseover = "changeBG('pwd')" onmouseout = "restoreBG('pwd')"><br>
        <label for = "Age">Age:</label><br>
        <input type = "number" id = "age" name = "age" value = "" onmouseover = "changeBG('age')" onmouseout = "restoreBG('age')"><br>
        <label for = "Site">Website:</label><br>
        <input type = "url" id = "site" name = "site" value = "" onmouseover = "changeBG('site')" onmouseout = "restoreBG('site')"><br>
        <label for = "Dob">Date of Birth:</label><br>
        <input type = "date" id = "dob" name = "dob" value = "" onmouseover = "changeBG('dob')" onmouseout = "restoreBG('dob')"><br>
        <label for = "Gender">Gender:</label><br>
        <input type = "radio" id = "gender" name = "gender" value = "Male"><label>Male</label><br>
        <input type = "radio" id = "gender" name = "gender" value = "Female"><label>Female</label><br>
        <input type = "radio" id = "gender" name = "gender" value = "Other"><label>Other</label><br>
        <label for = "Lang">Programming Language:</label><br>
        <input type = "checkbox" id = "lang" name = "lang" value = "Python"><label>Python</label><br>
        <input type = "checkbox" id = "lang" name = "lang" value = "HTML"><label>HTML</label><br>
        <input type = "checkbox" id = "lang" name = "lang" value = "JavaScript"><label>JavaScript</label><br>
        <input type = "checkbox" id = "lang" name = "lang" value = "C#"><label>C#</label><br>
        <input type = "checkbox" id = "lang" name = "lang" value = "Other"><label>Other</label><br>
        <input type = "submit" value = "Register">
    </form>
</div>
{% endblock %}
